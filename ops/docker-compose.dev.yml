# Lehen — local development stack with hot reload.
#
# Usage (from repo root):
#   cp ops/.env.example ops/.env       # then edit ops/.env
#   docker compose -f ops/docker-compose.dev.yml --env-file ops/.env up --build
#
# Hot reload: edits in hub/src/** trigger uvicorn reload inside the hub container.
# Keycloak runs externally on the LAN (see ops/.env). Ollama runs on the host;
# its URL is admin-managed in the LLMConfig document, not in env.

name: lehen-dev

services:
  hub:
    build:
      context: ../hub
      dockerfile: Dockerfile
      target: dev
    image: lehen/hub:dev
    container_name: lehen-hub-dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Bootstrap-only — see ops/.env.example. Everything else has code defaults.
      LEHEN_ARCADEDB__HOST: arcadedb
      LEHEN_ARCADEDB__PASSWORD: ${LEHEN_ARCADEDB__PASSWORD:?LEHEN_ARCADEDB__PASSWORD must be set in ops/.env}
      LEHEN_ARCADEDB__DATABASE: ${LEHEN_ARCADEDB__DATABASE:-lehen}
      LEHEN_KEYCLOAK__BASE_URL: ${LEHEN_KEYCLOAK__BASE_URL:?LEHEN_KEYCLOAK__BASE_URL must be set in ops/.env}
      LEHEN_KEYCLOAK__REALM: ${LEHEN_KEYCLOAK__REALM:-lehen}
      LEHEN_CRYPTO__MASTER_KEY: ${LEHEN_CRYPTO__MASTER_KEY:?LEHEN_CRYPTO__MASTER_KEY must be set in ops/.env}
      LEHEN_CRYPTO__AUDIT_PEPPER: ${LEHEN_CRYPTO__AUDIT_PEPPER:?LEHEN_CRYPTO__AUDIT_PEPPER must be set in ops/.env}
    volumes:
      - ../hub/src:/app/src:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      arcadedb:
        condition: service_healthy
    networks:
      - lehen
    restart: unless-stopped

  arcadedb:
    image: arcadedata/arcadedb:26.4.2
    container_name: lehen-arcadedb-dev
    environment:
      # Database creation is delegated to the hub's bootstrap, which uses the
      # server-admin path so root gets full permissions (ArcadeDB 26.x default
      # policy denies schema updates for users created via defaultDatabases).
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${LEHEN_ARCADEDB__PASSWORD:?LEHEN_ARCADEDB__PASSWORD must be set in ops/.env}
        -Darcadedb.server.mode=development
    ports:
      - "127.0.0.1:2480:2480"
    volumes:
      - arcadedb-data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2480/api/v1/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - lehen
    restart: unless-stopped

volumes:
  arcadedb-data:
    name: lehen-arcadedb-data

networks:
  lehen:
    name: lehen-dev
    driver: bridge
