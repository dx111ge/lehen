[project]
name = "lehen-hub"
version = "0.1.0"
description = "Lehen Hub: on-premise FastAPI server backing the role-based knowledge graph"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "dx111ge", email = "sven.andreas@gmail.com" }]
dependencies = [
    "fastapi>=0.130,<1.0",
    "uvicorn[standard]>=0.40,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "asyncpg>=0.30,<1.0",
    "structlog>=25.0,<26.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "cachetools>=5.5,<7.0",
    "cryptography>=43,<47",
    "argon2-cffi>=23.1,<26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.10,<1.0",
    "mypy>=1.15,<2.0",
    "respx>=0.22,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lehen_hub"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "ANN",          # flake8-annotations
    "S",            # flake8-bandit
    "B",            # flake8-bugbear
    "A",            # flake8-builtins
    "C4",           # flake8-comprehensions
    "DTZ",          # flake8-datetimez
    "PIE",          # flake8-pie
    "RET",          # flake8-return
    "SIM",          # flake8-simplify
    "TID",          # flake8-tidy-imports
    "PTH",          # flake8-use-pathlib
    "PL",           # pylint
    "RUF",          # ruff-specific
]
ignore = [
    "ANN401",       # Any allowed where intentional
    "PLR0913",      # too many arguments — FastAPI deps trip this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN", "PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "jose.*", "cachetools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config --cov=lehen_hub --cov-report=term-missing"
filterwarnings = [
    "error",
    # pytest-asyncio occasionally leaks ProactorEventLoop on Windows during
    # cross-test teardown. The leak is in the test runner, not application
    # code; we keep the strict ``error`` filter for everything else.
    "ignore:unclosed event loop:ResourceWarning",
]

[tool.coverage.run]
source = ["src/lehen_hub"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
